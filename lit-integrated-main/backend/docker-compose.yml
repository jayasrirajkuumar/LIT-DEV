services:
  postgres:
    image: postgres:16-alpine
    container_name: lit-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lit_dev
    ports:
      - "5432:5432"
    volumes:
      - lit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lit_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lit_pg_data:
